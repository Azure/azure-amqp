name: CI
on:
  push:
    branches:
      - hotfix
      - master
  pull_request:
  workflow_dispatch:
env:
  DOTNET_NOLOGO: true
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-2025
            name: Windows
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        shell: pwsh
        run: . .\build.ps1; Build-Solution -Configuration Release -Platform 'Any CPU'
      - name: Tests
        shell: pwsh
        run: . .\build.ps1; Run-Tests -Configuration Release
        timeout-minutes: 20
